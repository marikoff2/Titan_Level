plugins {
    id 'com.android.application'
}

android {
    namespace 'ua.titan.level'
    compileSdk 34

    defaultConfig {
        applicationId 'ua.titan.level'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // подписывается отладочным ключом — для установки на свои телефоны
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // шрифты и скрипты внутри приложения не сжимать
    androidResources {
        noCompress 'woff2', 'js'
    }
}
