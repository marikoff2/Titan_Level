name: Сборка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Собрать APK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk TitanLevel.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TitanLevel-apk
          path: TitanLevel.apk
      - name: Выложить в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Уровень станин 1.0.${{ github.run_number }}
          body: APK для установки на Android. Скачайте TitanLevel.apk на телефон и откройте.
          files: TitanLevel.apk
          make_latest: true
