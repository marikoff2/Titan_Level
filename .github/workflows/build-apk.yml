name: Сборка APK и Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Собрать APK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk TitanLevel.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TitanLevel-apk
          path: TitanLevel.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Собрать TitanLevel.exe
        shell: bash
        run: |
          mkdir -p windows/app
          cp -r app/src/main/assets/* windows/app/
          cp windows/build/icon.png windows/app/icon.png
          cd windows
          npm install --no-audit --no-fund
          npm run dist
          cp dist/TitanLevel.exe ../TitanLevel.exe
      - uses: actions/upload-artifact@v4
        with:
          name: TitanLevel-windows
          path: TitanLevel.exe

  release:
    needs: [build, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Выложить в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Уровень станин 1.0.${{ github.run_number }}
          body: |
            TitanLevel.apk — для Android: скачайте на телефон и откройте.
            TitanLevel.exe — для Windows: скачайте и запустите, установка не нужна.
          files: |
            TitanLevel.apk
            TitanLevel.exe
          make_latest: true
